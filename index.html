<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giveaway Hub</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
  line-height: 1.6;
}

header {
  background: #111827;
  color: white;
  padding: 20px;
  text-align: center;
}

.logo {
  font-size: 28px;
  font-weight: bold;
}

.hero {
  padding: 60px 20px;
  text-align: center;
  color: white;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
}

.hero h1 {
  font-size: 42px;
  margin-bottom: 15px;
}

.hero p {
  font-size: 19px;
  max-width: 650px;
  margin: auto;
}

.countdown {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 30px;
  flex-wrap: wrap;
}

.time {
  background: rgba(255,255,255,0.18);
  padding: 15px;
  min-width: 75px;
  border-radius: 10px;
}

.time strong {
  display: block;
  font-size: 25px;
}

.prizes {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  padding: 40px 20px;
}

.prize {
  background: white;
  width: 290px;
  padding: 30px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 6px 20px rgba(0,0,0,.08);
}

.prize-icon {
  font-size: 50px;
}

.prize h2 {
  margin: 10px 0;
}

.form-box {
  max-width: 520px;
  margin: 10px auto 45px;
  background: white;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 6px 20px rgba(0,0,0,.08);
}

.form-box h2 {
  text-align: center;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #ccd3df;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

button:hover {
  background: #1d4ed8;
}

.rules {
  max-width: 750px;
  margin: auto;
  padding: 20px;
}

.rules h2 {
  margin-bottom: 15px;
}

.rules p {
  margin-bottom: 15px;
}

.notice {
  background: #fff7ed;
  border-left: 4px solid #f97316;
  padding: 15px;
  margin-top: 20px;
  font-size: 14px;
}

#success {
  display: none;
  background: #ecfdf5;
  color: #065f46;
  padding: 15px;
  border-radius: 8px;
  margin-top: 15px;
  text-align: center;
}

footer {
  margin-top: 40px;
  padding: 25px;
  background: #111827;
  color: white;
  text-align: center;
}

.small {
  font-size: 13px;
  opacity: .8;
}
</style>
</head>

<body>

<header>
  <div class="logo">🎁 Giveaway Hub</div>
</header>

<section class="hero">
  <h1>Win $1 Million + A Car!</h1>

  <p>
    Enter
